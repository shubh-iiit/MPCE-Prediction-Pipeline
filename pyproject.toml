[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpce-prediction"
version = "1.0.0"
description = "MPCE Prediction Pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "scikit-learn==1.6.1",
    "joblib==1.3.2",
    "xgboost==2.0.3",
    "huggingface-hub==0.19.4",
]
